<!doctype html>
<html lang="ko" data-view="library">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>akbo</title>
<meta name="description" content="피아노 악보 뷰어">
<meta name="theme-color" content="#12141a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="악보">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ─────────────── 라이브러리 ─────────────── -->
<div id="library">
  <header class="topbar">
    <div class="brand">
      <svg class="leaf" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3.5c0 8.6-4.7 13.2-11 13.2-1.1 0-2.1-.15-3-.42C7.6 9.9 12.9 5.5 20 3.5Z"/><path class="stem" d="M4 21c1.2-4.6 3.4-8 6.6-10.4"/></svg>
      <span>akbo<i>·</i>악보</span>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="곡·작곡가 검색" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <button id="qclear" class="qclear" type="button" aria-label="검색어 지우기" hidden>&times;</button>
    </div>

    <div class="toolbar">
      <button id="themeBtn" class="icon-btn" type="button" title="테마 전환" aria-label="테마 전환">
        <svg class="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24"><path d="M20 14.4A8.5 8.5 0 0 1 9.6 4 8.5 8.5 0 1 0 20 14.4Z"/></svg>
      </button>
      <button id="offlineBtn" class="icon-btn" type="button" title="오프라인 저장" aria-label="오프라인 저장">
        <svg viewBox="0 0 24 24"><path d="M12 3.5v11M12 14.5 8 10.5M12 14.5l4-4"/><path d="M4 15.5v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>
  </header>

  <nav class="filters" id="filters"></nav>

  <main class="grid" id="grid"></main>
  <p class="empty" id="empty" hidden>검색 결과가 없습니다.</p>

  <footer class="foot">
    <span id="stat"></span>
    <span id="offstat" class="offstat"></span>
  </footer>
</div>

<!-- ─────────────── 뷰어 ─────────────── -->
<div id="reader" hidden>
  <div class="stage" id="stage">
    <div class="pages" id="pages"></div>
  </div>

  <div class="tap tap-prev" id="tapPrev" aria-hidden="true"></div>
  <div class="tap tap-next" id="tapNext" aria-hidden="true"></div>
  <div class="tap tap-mid"  id="tapMid"  aria-hidden="true"></div>

  <header class="rbar rbar-top" id="rtop">
    <button id="backBtn" class="icon-btn" type="button" aria-label="목록으로">
      <svg viewBox="0 0 24 24"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg>
    </button>
    <div class="rtitle">
      <strong id="rTitle"></strong>
      <span id="rComposer"></span>
    </div>
    <div class="rtools">
      <button id="listenBtn" class="icon-btn" type="button" aria-label="참고 음원 듣기" title="참고 음원 (P)" hidden>
        <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.6"/><circle cx="16.5" cy="16" r="2.6"/></svg>
      </button>
      <button id="favBtn"    class="icon-btn" type="button" aria-label="즐겨찾기">
        <svg viewBox="0 0 24 24"><path d="m12 3.8 2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8Z"/></svg>
      </button>
      <button id="spreadBtn" class="icon-btn" type="button" aria-label="두 장 보기" title="두 장 보기 (S)">
        <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="7.5" height="15" rx="1"/><rect x="13.5" y="4.5" width="7.5" height="15" rx="1"/></svg>
      </button>
      <button id="fitBtn"    class="icon-btn" type="button" aria-label="맞춤 전환" title="폭 맞춤 (W)">
        <svg viewBox="0 0 24 24"><path d="M3 12h18M3 12l3.5-3.5M3 12l3.5 3.5M21 12l-3.5-3.5M21 12l-3.5 3.5"/></svg>
      </button>
      <button id="fsBtn"     class="icon-btn" type="button" aria-label="전체화면" title="전체화면 (F)">
        <svg viewBox="0 0 24 24"><path d="M4 9V4.5h5M20 9V4.5h-5M4 15v4.5h5M20 15v4.5h-5"/></svg>
      </button>
    </div>
  </header>

  <footer class="rbar rbar-bottom" id="rbot">
    <button id="prevBtn" class="icon-btn" type="button" aria-label="이전 장">
      <svg viewBox="0 0 24 24"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg>
    </button>
    <input id="scrub" class="scrub" type="range" min="0" max="0" step="1" value="0" aria-label="페이지 이동">
    <span class="counter" id="counter">1 / 1</span>
    <button id="nextBtn" class="icon-btn" type="button" aria-label="다음 장">
      <svg viewBox="0 0 24 24"><path d="m9 4.5 7.5 7.5L9 19.5"/></svg>
    </button>
  </footer>
</div>

<!-- ─────────────── 미니 플레이어 (목록·뷰어 공용, 페이지 넘겨도 유지) ─────────────── -->
<aside id="player" class="player" hidden aria-label="참고 음원">
  <div class="player-bar">
    <strong id="plTitle"></strong>
    <a id="plOpen" class="icon-btn" target="_blank" rel="noopener noreferrer" aria-label="YouTube에서 열기" title="YouTube에서 열기">
      <svg viewBox="0 0 24 24"><path d="M14 4.5h5.5V10"/><path d="m19.5 4.5-8 8"/><path d="M18 14.5v4a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6h4"/></svg>
    </a>
    <button id="plCollapse" class="icon-btn" type="button" aria-label="접기" aria-expanded="true">
      <svg viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></svg>
    </button>
    <button id="plClose" class="icon-btn" type="button" aria-label="닫기">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="player-frame" id="plFrame"></div>
  <div class="player-tabs" id="plTabs"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
</body>
</html>
